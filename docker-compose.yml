services:
  postgres:
    image: postgres:15-alpine
    container_name: import-v4-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: import_v4
    ports:
      - "5433:5432"
    volumes:
      - import-v4-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d import_v4"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: import-v4-redis
    ports:
      - "6379:6379"
    volumes:
      - import-v4-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  import-v4-pgdata:
  import-v4-redisdata:
